<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 포털</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#FFF4EE;--ink:#4A3B47;--sub:#6B5764;--card:#FFFFFF;--pink:#FFC9D6;--pink2:#F29BB5;--mint:#BFE8D9;--line:#F1E2DE;--ok:#2E7D5E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px}
h1,h2,.brand{font-family:'Jua',sans-serif;font-weight:400;margin:0}
button,input{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer;border:none;border-radius:12px;min-height:44px;padding:0 16px;background:var(--mint)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input{height:48px;border:1.5px solid #D9C6C0;border-radius:12px;padding:0 14px;background:#fff;min-width:0}
.wrap{display:flex;flex-wrap:wrap;min-height:100vh}
nav{flex:1 1 200px;padding:24px 18px;display:flex;flex-direction:column;gap:8px}
.brand{font-size:24px;margin-bottom:12px}
.nav-item{padding:12px 14px;border-radius:12px;color:var(--sub)}
.nav-item.on{background:var(--mint);color:var(--ink);font-weight:700}
.nav-item small{display:block;font-size:13px}
main{flex:999 1 520px;min-width:0;padding:24px 22px 40px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border-radius:20px;padding:20px}
.add{display:flex;gap:10px;flex-wrap:wrap}
.add input{flex:1 1 180px}
.primary{background:var(--pink2);color:#3A2230;font-weight:700}
.plain{background:#FBEDE8}
.danger{background:#FBEDE8;color:#9C2748}
.list{display:flex;flex-direction:column}
.stu{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.stu:first-child{border-top:none}
.stu .name{font-family:'Jua',sans-serif;font-size:20px;flex:1 1 120px}
.tag{font-size:14px;color:var(--sub)}
.tag.on{color:var(--ok);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{color:var(--sub);font-size:15px;line-height:1.6;margin:0}
.url{word-break:break-all;font-weight:700}
.gate{max-width:380px;margin:12vh auto 0;padding:0 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.msg{min-height:22px;color:#9C2748;font-size:15px;margin:0}
</style>
</head>
<body>
<div id="app"><p class="hint" style="padding:24px">불러오는 중…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="common.js"></script>
<script>
const app = document.getElementById('app');
const store = makeStore();
let students = {}, presence = {}, teacherHash = undefined, authed = false, msg = '', confirmDel = null;
const studentUrl = location.href.replace(/teacher\.html.*$/, '');

function sess(v) { try { if (v === undefined) return sessionStorage.getItem('sw_teacher'); sessionStorage.setItem('sw_teacher', v); } catch (e) { } return null; }

store.on('teacher/pinHash', v => { teacherHash = v || null; if (MOCK || (teacherHash && sess() === teacherHash)) authed = true; render(); });
store.on(BASE + '/students', v => { students = v || {}; render(); });
store.on(BASE + '/presence', v => { presence = v || {}; render(); });

function render() {
  if (teacherHash === undefined) return;
  if (!authed) {
    const first = !teacherHash;
    const keep = document.getElementById('tpin');
    const val = keep ? keep.value : '';
    app.innerHTML = '<form class="gate" id="gate"><h1>선생님 포털</h1>' +
      '<p class="hint">' + (first ? '처음 오셨네요. 선생님 비밀번호를 정해 주세요. (숫자 6자리 이상)' : '선생님 비밀번호를 입력해 주세요.') + '</p>' +
      '<label for="tpin" class="hint">비밀번호</label><input id="tpin" type="password" inputmode="numeric" autocomplete="off">' +
      '<p class="msg" role="status">' + esc(msg) + '</p>' +
      '<button class="primary" type="submit">' + (first ? '정하고 들어가기' : '들어가기') + '</button></form>';
    document.getElementById('tpin').value = val;
    return;
  }
  const ids = Object.keys(students);
  const keepName = document.getElementById('newName');
  const nameVal = keepName ? keepName.value : '';
  app.innerHTML = '<div class="wrap"><nav aria-label="메뉴"><div class="brand">선생님 포털</div>' +
    '<div class="nav-item on">학생 관리</div>' +
    '<div class="nav-item">수업 진행<small>준비 중</small></div>' +
    '<div class="nav-item">숙제 현황<small>준비 중</small></div>' +
    '<div class="nav-item">문제 관리<small>준비 중</small></div></nav>' +
    '<main><h1>학생 관리</h1>' +
    '<div class="card"><p class="hint">학생들이 접속할 주소</p><p class="url">' + esc(studentUrl) + '</p></div>' +
    '<form class="card add" id="addForm"><label for="newName" class="hint" style="flex:1 1 100%">학생 추가 (이름 또는 별명)</label>' +
    '<input id="newName" maxlength="8" autocomplete="off"><button class="primary" type="submit">추가</button></form>' +
    '<div class="card"><h2 style="font-size:20px;margin-bottom:6px">우리 반 (' + ids.length + '명)</h2><div class="list">' +
    (ids.length ? ids.map(id => {
      const s = students[id];
      return '<div class="stu">' + avatarSVG(s.avatar, 52) + '<div class="name">' + esc(s.name) + '</div>' +
        '<span class="tag' + (presence[id] ? ' on' : '') + '">' + (presence[id] ? '접속 중' : '미접속') + '</span>' +
        '<span class="tag">비밀번호 ' + (s.pinHash ? '설정됨' : '아직 없음') + '</span>' +
        '<div class="acts">' + (s.pinHash ? '<button class="plain" data-act="reset" data-id="' + esc(id) + '">비밀번호 초기화</button>' : '') +
        '<button class="danger" data-act="del" data-id="' + esc(id) + '">' + (confirmDel === id ? '정말 삭제할까요?' : '삭제') + '</button></div></div>';
    }).join('') : '<p class="hint">아직 등록된 학생이 없습니다. 위에서 추가해 주세요.</p>') +
    '</div></div></main></div>';
  document.getElementById('newName').value = nameVal;
}

app.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'gate') {
    const v = document.getElementById('tpin').value.trim();
    if (!teacherHash) {
      if (!/^\d{6,}$/.test(v)) { msg = '숫자 6자리 이상으로 정해 주세요.'; render(); return; }
      const h = await hashPin('teacher', v);
      await store.set('teacher/pinHash', h); teacherHash = h; sess(h); authed = true; msg = '';
    } else {
      const h = await hashPin('teacher', v);
      if (h === teacherHash) { sess(h); authed = true; msg = ''; } else { msg = '비밀번호가 다릅니다.'; }
    }
    document.getElementById('tpin').value = '';
    render();
  } else if (e.target.id === 'addForm') {
    const input = document.getElementById('newName');
    const name = input.value.trim();
    if (!name) return;
    input.value = '';
    await store.set(BASE + '/students/' + store.newId(), { name: name, createdAt: Date.now() });
  }
});

app.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'reset') { await store.remove(BASE + '/students/' + id + '/pinHash'); }
  else if (b.dataset.act === 'del') {
    if (confirmDel !== id) { confirmDel = id; render(); return; }
    confirmDel = null;
    await store.remove(BASE + '/presence/' + id);
    await store.remove(BASE + '/students/' + id);
  }
});
</script>
</body>
</html>
