<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 공부방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#FFF4EE;--ink:#4A3B47;--sub:#6B5764;--card:#FFFFFF;--pink:#FFC9D6;--pink2:#F29BB5;--mint:#BFE8D9;--yellow:#FFE39A;--blue:#CFE0FF;--ok:#2E7D5E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;min-height:100%;padding:28px 22px 32px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:30px;font-weight:400;text-align:center}
p{margin:0}
.sub{color:var(--sub);font-size:17px;text-align:center}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border-radius:28px;padding:22px}
.names{display:flex;flex-direction:column;gap:14px}
.name-btn{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:26px;padding:14px 20px;font-size:26px;text-align:left;min-height:84px}
.name-btn:nth-child(3n+1){background:var(--pink)}
.name-btn:nth-child(3n+2){background:var(--mint)}
.name-btn:nth-child(3n){background:var(--yellow)}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0}
.dot{width:22px;height:22px;border-radius:50%;background:#F1E2DE}
.dot.on{background:var(--pink2)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key{height:72px;border-radius:22px;background:var(--card);font-size:30px}
.key:active{background:var(--yellow)}
.key.small{font-size:18px;background:transparent;color:var(--sub)}
.msg{min-height:24px;text-align:center;font-size:17px;color:#B4325A}
.swatches{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.swatch{width:48px;height:48px;border-radius:50%;border:4px solid #FFFFFF}
.swatch.on{border-color:var(--ink)}
.styles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.style-btn{height:56px;border-radius:20px;background:#FBEDE8;font-size:18px}
.style-btn.on{background:var(--mint);box-shadow:inset 0 0 0 3px var(--ink)}
.big{height:68px;border-radius:24px;background:var(--pink2);font-size:24px;color:#3A2230}
.ghost{background:transparent;color:var(--sub);font-size:16px;height:44px;text-decoration:underline}
.center{display:flex;justify-content:center}
.label{font-size:17px;color:var(--sub);margin-bottom:10px}
.lobby{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:17px}
.seat.off{opacity:.4}
.state{font-size:14px;color:var(--sub)}
.seat.on .state{color:var(--ok)}
.wait{background:var(--yellow);border-radius:24px;padding:18px;text-align:center;font-size:19px;line-height:1.5}
.row{display:flex;justify-content:space-between;gap:10px}
.chip{border-radius:999px;padding:8px 16px;font-size:16px;background:var(--pink)}
.cd{width:92px;height:92px;border-radius:50%;background:var(--yellow);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:46px}
.cd.idle{font-size:20px;color:var(--sub)}
.qtext{font-size:30px;line-height:1.4;text-align:center}
mark{background:var(--pink);color:inherit;border-radius:12px;padding:2px 10px}
.choices{display:grid;gap:12px}
.choice{height:78px;border-radius:26px;font-size:26px;border:4px solid transparent}
.choice:nth-child(4n+1){background:var(--pink)}.choice:nth-child(4n+2){background:var(--mint)}.choice:nth-child(4n+3){background:var(--yellow)}.choice:nth-child(4n){background:var(--blue)}
.choice.on{border-color:var(--ink)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.45}
.banner{border-radius:28px;padding:26px 20px;text-align:center;font-size:34px}
.banner.good{background:var(--mint)}.banner.soft{background:#FBEDE8}
.why{font-size:19px;line-height:1.6;text-align:center}
.bignum{font-size:54px;text-align:center}
.mock{background:var(--blue);border-radius:14px;padding:8px 12px;font-size:14px;text-align:center}
</style>
</head>
<body>
<main id="app"><p class="sub">불러오는 중…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 항상 최신 파일을 받아 오도록 주소 뒤에 시간을 붙여 불러옵니다
(function(){var v=Date.now();["common.js", "questions.js", "student.js"].reduce(function(p,f){return p.then(function(){return new Promise(function(ok){var s=document.createElement("script");s.src=f+"?v="+v;s.onload=ok;document.body.appendChild(s);});});},Promise.resolve());})();
</script>
</body>
</html>
