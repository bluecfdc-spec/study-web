<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 화면</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수업 화면">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF4EE">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#FFF4EE;--ink:#4A3B47;--sub:#6B5764;--card:#FFFFFF;--pink:#FFC9D6;--pink2:#F29BB5;--mint:#BFE8D9;--yellow:#FFE39A;--blue:#CFE0FF;--ok:#2E7D5E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#app{min-height:100vh;padding:3vh 4vw;display:flex;flex-direction:column;gap:2.4vh}
h1{margin:0;font-weight:400;font-size:clamp(28px,4.4vw,56px);text-align:center}
p{margin:0}
.sub{color:var(--sub);font-size:clamp(16px,2vw,26px);text-align:center}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{background:var(--pink);border-radius:999px;padding:8px 20px;font-size:clamp(16px,2vw,26px)}
.card{background:var(--card);border-radius:32px;padding:3vh 3vw}
.qtext{font-size:clamp(34px,6.4vw,92px);line-height:1.3;text-align:center}
mark{background:var(--pink);color:inherit;border-radius:18px;padding:0 .25em}
.choices{display:flex;gap:1.6vw;flex-wrap:wrap}
.choice{flex:1 1 160px;border-radius:26px;padding:2.2vh 1vw;text-align:center;font-size:clamp(22px,3.4vw,48px);border:6px solid transparent}
.choice:nth-child(4n+1){background:var(--pink)}.choice:nth-child(4n+2){background:var(--mint)}.choice:nth-child(4n+3){background:var(--yellow)}.choice:nth-child(4n){background:var(--blue)}
.choice.right{border-color:var(--ink)}
.choice.fade{opacity:.35}
.seats{display:flex;justify-content:center;gap:4vw;flex-wrap:wrap}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(16px,2vw,26px);text-align:center}
.seat.off{opacity:.35}
.state{font-size:clamp(14px,1.6vw,22px);color:var(--sub)}
.state.good{color:var(--ok)}
.cd{width:clamp(90px,13vw,170px);height:clamp(90px,13vw,170px);border-radius:50%;background:var(--yellow);border:8px solid #fff;display:flex;align-items:center;justify-content:center;font-size:clamp(46px,8vw,104px);margin:0 auto}
.why{font-size:clamp(20px,2.8vw,38px);text-align:center;line-height:1.5}
.bar{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.go{background:var(--pink2);color:#3A2230;border-radius:22px;min-height:60px;padding:0 30px;font-size:clamp(20px,2.2vw,28px)}
.quiet{background:transparent;color:var(--sub);text-decoration:underline;font-size:17px;min-height:44px;padding:0 8px;font-family:inherit}
.sets{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;width:100%}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border-radius:24px;padding:16px 22px;font-size:clamp(18px,2.2vw,26px)}
.team{background:var(--yellow);border-radius:24px;padding:14px 26px;font-size:clamp(20px,2.6vw,34px);text-align:center;align-self:center}
</style>
</head>
<body>
<main id="app"><p class="sub">불러오는 중…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 항상 최신 파일을 받아 오도록 주소 뒤에 시간을 붙여 불러옵니다
(function(){var v=Date.now();["common.js", "questions.js", "daily.js", "engset.js", "stage.js", "lesson.js", "home.js", "draw.js", "full.js"].reduce(function(p,f){return p.then(function(){return new Promise(function(ok){var s=document.createElement("script");s.src=f+"?v="+v;s.onload=ok;document.body.appendChild(s);});});},Promise.resolve());})();
</script>
</body>
</html>
