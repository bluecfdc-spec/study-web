<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크림이네 공부방 · 내각의 합 설명</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="mathvid.css">
</head>
<body>
<main>
<h1 id="ttl">다각형의 <span class="k" id="kw">내각의 합</span></h1>
<div class="row">
  <svg id="svg" viewBox="0 0 400 410" aria-label="육각형"></svg>
  <div class="side">
    <div class="formula" id="fml"><span id="f180">180°</span><span id="fX">×</span><span id="fM">(n − 2)</span></div>
    <div class="asm"><span id="a180">180°</span><span id="aX">×</span><span id="aM">(6 − 2)</span><span id="aE" class="eq">= 720°</span></div>
    <hr id="rule">
    <div class="build">
      <div class="l" id="b1">삼각형 한 개의 내각의 합 = <b>180°</b></div>
      <div class="l" id="b2">육각형 안에 삼각형 <b>4개</b></div>
      <div class="l" id="b3">삼각형은 항상 n − 2개 → 6 − 2 = <b>4</b></div>
      <div class="l" id="b4">180° × 4 = <b>720°</b></div>
    </div>
  </div>
</div>
<div class="memo" id="memo"><small><span class="must">꼭! 꼭! 꼭! 외우기</span> 공식의 의미</small><b>n각형의 내각의 합 = 180° × (n − 2)</b><br>① 삼각형 한 개의 내각의 합은 <b>180°</b><br>② 다각형 안에 삼각형이 몇 개인지 세면 내각의 합을 알 수 있다<br>③ 다각형 안의 삼각형은 항상 <b>(n − 2)개</b> → 그래서 <b>180° × (n − 2)</b></div>
<div class="bar">
  <button id="prev" type="button">← 이전</button>
  <span class="step" id="stepNo"></span>
  <label class="auto"><input type="checkbox" id="auto"> 자동</label>
  <button id="next" class="go" type="button">다음 →</button>
</div>
</main>
<script>
(function () {
  const N = 6, CX = 200, CY = 205, R = 128;
  const P = []; for (let i = 0; i < N; i++) { const a = (90 - 360 * i / N) * Math.PI / 180; P.push([CX + R * Math.cos(a), CY - R * Math.sin(a)]); }
  const NAMES = ['A', 'B', 'C', 'D', 'E', 'F'], COL = ['#F29BB5', '#F2B24C', '#58B894', '#8DB8FF'];
  const pt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  let h = '';
  // 삼각형 4개 (A 와 이웃한 두 점): A-B-C, A-C-D, A-D-E, A-E-F
  for (let k = 0; k < 4; k++) {
    const t = [P[0], P[k + 1], P[k + 2]], cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
    h += '<polygon class="tri" id="t' + k + '" points="' + t.map(pt).join(' ') + '" fill="' + COL[k] + '" fill-opacity=".5"/>';
    h += '<text class="tn" id="n' + k + '" x="' + cx + '" y="' + (cy + 10) + '">' + (k + 1) + '</text>';
    h += '<text class="deg" id="g' + k + '" x="' + cx + '" y="' + (cy + 10) + '">180°</text>';
  }
  for (let i = 0; i < N; i++) { const a = P[i], b = P[(i + 1) % N]; h += '<line class="edge" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>'; }
  for (let k = 2; k <= 4; k++) h += '<line class="dg" id="d' + k + '" x1="' + P[0][0] + '" y1="' + P[0][1] + '" x2="' + P[k][0] + '" y2="' + P[k][1] + '"/>';
  for (let i = 0; i < N; i++) {
    const [x, y] = P[i], ox = (x - CX) / R, oy = (y - CY) / R;
    h += '<circle class="vx" id="v' + i + '" cx="' + x + '" cy="' + y + '" r="11"/>';
    h += '<text class="lbl" x="' + (x + ox * 28) + '" y="' + (y + oy * 28 + 7) + '">' + NAMES[i] + '</text>';
    h += '<text class="cnt" id="c' + i + '" x="' + (x + ox * 60) + '" y="' + (y + oy * 60 + 9) + '">' + (i + 1) + '</text>';
  }
  document.getElementById('svg').innerHTML = h;
  const $ = id => document.getElementById(id);
  const on = (id, c) => $(id).classList.add(c), off = (id, c) => $(id).classList.remove(c);
  const show = function () { for (const id of arguments) on(id, 'show'); };
  const blink = function () { for (const id of arguments) on(id, 'blink'); };
  const unblink = () => document.querySelectorAll('.blink').forEach(e => e.classList.remove('blink'));
  let timers = []; const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  const STEPS = [
    { sec: 4, run: () => { show('ttl'); blink('kw'); } },                                                   // 제목
    { sec: 4, run: () => { show('svg'); } },                                                                // 육각형
    { sec: 5, run: () => { off('kw', 'blink'); show('fml'); } },                                            // 본 공식
    { sec: 6, run: () => { blink('f180'); show('rule', 'b1', 'a180', 't0', 'd2', 'g0'); blink('t0', 'g0'); } },   // 삼각형 한 개 = 180°
    { sec: 8, run: q => { unblink(); for (let k = 1; k < 4; k++) { if (q) show('t' + k, 'g' + k, 'd' + (k + 2 > 4 ? 4 : k + 2)); else later(() => show('t' + k, 'g' + k, 'd' + (k + 2 > 4 ? 4 : k + 2)), 300 + (k - 1) * 900); } if (q) show('b2'); else later(() => show('b2'), 3200); } },   // 삼각형 몇 개? 2·3·4
    { sec: 5, run: () => { blink('fM'); show('b3', 'aM'); } },   // 항상 n − 2
    { sec: 5, run: () => { unblink(); blink('fX'); show('aX', 'b4', 'aE'); } },                               // 180° × 4 = 720°
    { sec: 4, run: () => { unblink(); ['f180', 'fX', 'fM'].forEach(id => on(id, 'lit')); } },                // 공식 완성
    { sec: 8, run: () => { show('memo'); } }                                                                // 요약
  ];
  let step = -1, autoT = null;
  function reset() { timers.forEach(clearTimeout); timers = []; document.querySelectorAll('.blink,.show,.lit,.me').forEach(e => e.classList.remove('blink', 'show', 'lit', 'me')); }
  function go(n) {
    if (n < 0 || n >= STEPS.length) return;
    reset();
    for (let i = 0; i < n; i++) { STEPS[i].run(true); timers.forEach(clearTimeout); timers = []; }
    STEPS[n].run(false);
    step = n;
    $('stepNo').textContent = (n + 1) + ' / ' + STEPS.length;
    $('prev').disabled = n === 0; $('next').textContent = n === STEPS.length - 1 ? '처음부터' : '다음 →';
    if (window.VID && VID.onChange) VID.onChange(n);
    clearTimeout(autoT); if ($('auto').checked) autoT = setTimeout(() => go((step + 1) % STEPS.length), STEPS[n].sec * 1000);
  }
  $('next').addEventListener('click', () => go((step + 1) % STEPS.length));
  $('prev').addEventListener('click', () => go(step - 1));
  $('auto').addEventListener('change', () => go(step));
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('next').click(); } if (e.key === 'ArrowLeft') $('prev').click(); });
  window.VID = { k: 3, go: go, steps: STEPS.length, cur: () => step, onChange: null };
  go(0);
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="common.js"></script>
<script src="mathquiz.js"></script>
</body>
</html>
